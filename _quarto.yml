project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"

website:
  title: "AI-augmented agents"
  description: "How to hand work from one agent to another, by what a first review of 35 sources and one small run found: the task file, the result file and the checks the lead runs, each principle with its grade of evidence."
  site-url: "https://tewf.github.io/ai-augmented-agents/"
  repo-url: "https://github.com/Tewf/ai-augmented-agents"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Standard
        href: standard.md
      - text: Principles
        href: principles/index.qmd
      - text: Shapes
        href: shapes/index.qmd
      - text: Evidence
        href: evidence/index.qmd
      - text: Decisions
        href: decisions/README.md
    right:
      - text: The family
        href: https://tewf.github.io/ai-augmented/
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
