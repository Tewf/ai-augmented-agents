# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The headings the standard's decision-record shape requires (reader-ergonomics v1.21.0, shapes/decision-record.md).
[shape_conformance]
shapes = [{ name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] }]

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics",
          "reader-ergonomics-topic",
          "reader-ergonomics-blueprint",
          "reader-ergonomics-review"]
shared_links = []

# The standard's card: the principle groups, in the order the card shows them (extending.md, Indexes).
[standard_card]
facets = ["brief", "result"]

# Each shape links, or holds, a filled example of itself (the standard's shape-example check).
[shape_example]
files = ["shapes/exchange.md"]
example_headings = ["Worked example"]

# The result of an exchange is a worker's reply kept as it came (shapes/exchange.md, rule 6), so the prose checks leave
# it alone; exchange-pairs reads it through the repository's file list. The first three are the standard's own.
[scope]
exclude = ["LICENSE", "LICENSES/", "checks/out/", "shapes/examples/*.result.md"]

# The exchange checks, checks/local/: the file names, the four headings, the two lines of Decided, and the words
# that mark a verdict (shapes/exchange.md).
[exchange]
task_files = ["*.task.md"]
result_files = ["*.result.md"]
headings = ["Task", "Decided", "To find", "Checks"]
decided_labels = ["Why handed over", "If the check fails"]
verdict_headings = ["Verdict", "Review", "Accepted", "Rejected", "Decision"]
